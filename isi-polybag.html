
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengisian Polybag - SIP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script type="module">
        import { db, requireAuth } from "./firebase.js";

        import {
            collection,
            addDoc,
            getDocs,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Memastikan pengguna sudah login
        if (!(await requireAuth())) {
            throw new Error("Login diperlukan.");
        }

        // Fungsi menyimpan data pengisian polybag
        window.simpanData = async function(e) {
            e.preventDefault();

            const tanggal = document.getElementById("ip-tanggal").value;
            const jumlah = Number(document.getElementById("ip-jumlah").value);

            if (!tanggal) {
                alert("Tanggal pengisian wajib diisi.");
                return;
            }

            if (!Number.isInteger(jumlah) || jumlah <= 0) {
                alert("Jumlah polybag harus berupa bilangan bulat lebih dari 0.");
                return;
            }

            try {
                await addDoc(collection(db, "isi_polybag"), {
                    tanggal: tanggal,
                    jumlah: jumlah,
                    timestamp: new Date()
                });

                alert("Pengisian polybag berhasil disimpan ke Cloud!");

                window.location.href = "index.html";

            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert("Gagal menyimpan data: " + error.message);
            }
        };

        // Fungsi memuat riwayat pengisian polybag
        async function muatTabel() {
            const tbody = document.getElementById("tabel-data");

            try {
                const q = query(
                    collection(db, "isi_polybag"),
                    orderBy("tanggal", "desc")
                );

                const querySnapshot = await getDocs(q);

                tbody.innerHTML = "";

                if (querySnapshot.empty) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="p-4 text-center text-slate-400">
                                Belum ada riwayat pengisian polybag.
                            </td>
                        </tr>
                    `;
                    return;
                }

                let no = 1;

                querySnapshot.forEach((doc) => {
                    const d = doc.data();

                    tbody.innerHTML += `
                        <tr class="border-b">
                            <td class="p-3">${no++}</td>
                            <td class="p-3">${d.tanggal || "-"}</td>
                            <td class="p-3 font-semibold text-emerald-700">
                                ${d.jumlah ?? 0} Pcs
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Gagal memuat tabel:", error);

                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="p-4 text-center text-red-600">
                            Gagal memuat data. Periksa koneksi dan akses Firestore.
                        </td>
                    </tr>
                `;
            }
        }

        // Memuat tabel setelah autentikasi selesai
        await muatTabel();
    </script>
</head>

<body class="bg-emerald-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">
                🌱 SIP - Pengisian Media ke Polybag
            </h1>

            <a href="index.html" class="text-xs bg-emerald-900 px-3 py-1.5 rounded-lg">
                Kembali
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

        <div class="bg-white p-6 rounded-2xl shadow">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">
                Formulir Pengisian Polybag
            </h2>

            <form onsubmit="simpanData(event)" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium">
                        Tanggal Pengisian
                    </label>

                    <input
                        type="date"
                        id="ip-tanggal"
                        required
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium">
                        Jumlah Polybag Terisi (Pcs)
                    </label>

                    <input
                        type="number"
                        id="ip-jumlah"
                        min="1"
                        step="1"
                        required
                        placeholder="3000"
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-emerald-700 text-white p-3 rounded-xl font-medium cursor-pointer"
                >
                    Simpan ke Cloud
                </button>

            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-lg font-bold text-emerald-900 mb-4">
                Riwayat Pengisian Polybag
            </h3>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">

                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900">
                            <th class="p-3">No</th>
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Jumlah Terisi</th>
                        </tr>
                    </thead>

                    <tbody id="tabel-data">
                        <tr>
                            <td colspan="3" class="p-4 text-center text-slate-400">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </main>

</body>
</html>
