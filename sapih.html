<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyapihan - SIP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">

        import { db, requireAuth } from "./firebase.js";

import { collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        
        if (!(await requireAuth())) throw new Error('Login diperlukan.');
// Simpan data batch untuk pengecekan validasi stok
        let petaStokTabur = {};
        let petaJenisTabur = {};

        async function loadDataAwal() {
            // 1. Muat pilihan batch tabur
            const snapTabur = await getDocs(collection(db, "tabur_benih"));
            let select = document.getElementById('s-batch');
            snapTabur.forEach(doc => {
                let d = doc.data();
                petaStokTabur[d.kode] = Number(d.jumlah); // Rekam jumlah benih awal
                petaJenisTabur[d.kode] = d.jenis || "Tidak diketahui";
                select.innerHTML += `<option value="${d.kode}">${d.kode} - ${d.jenis} (Stok: ${d.jumlah})</option>`;
            });

            // 2. Muat riwayat tabel penyapihan
            const snapSapih = await getDocs(collection(db, "penyapihan"));
            let tbody = document.getElementById('tabel-data');
            tbody.innerHTML = "";
            let no = 1;
            snapSapih.forEach(doc => {
                let d = doc.data();
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${no++}</td>
                        <td class="p-3 font-medium">${d.batch}</td>
                        <td class="p-3">${d.ukuran || 'Belum dicatat'}</td>
                        <td class="p-3">${d.tanggal}</td>
                        <td class="p-3">${d.lokasi}</td>
                        <td class="p-3 font-semibold text-emerald-700">${d.jumlah} Bibit</td>
                    </tr>
                `;
            });
        }
        window.onload = loadDataAwal;

        window.simpanData = async function(e) {
            e.preventDefault();
            let batchPilihan = document.getElementById('s-batch').value;
            let jumlahDisapih = parseInt(document.getElementById('s-jumlah').value);
            let stokMaksimal = petaStokTabur[batchPilihan] || 0;

            // VALIDASI: Cek apakah jumlah disapih melebihi benih yang ditabur
            if (jumlahDisapih > stokMaksimal) {
                alert(`Peringatan Anomali: Jumlah disapih (${jumlahDisapih}) melebihi stok benih ditabur pada batch ini (${stokMaksimal})!`);
                return; // Batalkan proses simpan
            }

            try {
                await addDoc(collection(db, "penyapihan"), {
                    batch: batchPilihan,
                    jenis: petaJenisTabur[batchPilihan] || "Tidak diketahui",
                    ukuran: document.getElementById('s-ukuran').value.trim(),
                    sumber: "Media tabur",
                    tanggal: document.getElementById('s-tanggal').value,
                    jumlah: jumlahDisapih,
                    lokasi: document.getElementById('s-lokasi').value,
                    timestamp: new Date()
                });
                alert('Penyapihan berhasil disimpan ke Cloud!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Gagal menyimpan ke cloud.');
            }
        }
    </script>
</head>
<body class="bg-emerald-50 text-slate-800 font-sans min-h-screen">
    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🌱 SIP - Penyapihan (Polybag)</h1>
            <a href="index.html" class="text-xs bg-emerald-900 px-3 py-1.5 rounded-lg">Kembali</a>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <div class="bg-white p-6 rounded-2xl shadow">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">Formulir Penyapihan Bibit</h2>
            <form onsubmit="simpanData(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Pilih Batch Tabur</label>
                    <select id="s-batch" required class="w-full mt-1 p-3 border rounded-xl">
                        <option value="">-- Pilih Batch --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Ukuran / Tinggi Bibit</label>
                    <input type="text" id="s-ukuran" required placeholder="Contoh: 20–30 cm atau 80–100 cm" class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium">Tanggal Penyapihan</label>
                    <input type="date" id="s-tanggal" required class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium">Jumlah Kecambah Disapih</label>
                    <input type="number" id="s-jumlah" required placeholder="4200" class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium">Lokasi Bedeng Sapih</label>
                    <input type="text" id="s-lokasi" required placeholder="Bedeng Sapih B3" class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <button type="submit" class="w-full bg-emerald-700 text-white p-3 rounded-xl font-medium cursor-pointer">Simpan ke Cloud</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-lg font-bold text-emerald-900 mb-4">Riwayat Penyapihan Bibit</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900">
                            <th class="p-3">No</th>
                            <th class="p-3">Batch</th>
                            <th class="p-3">Ukuran</th>
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Lokasi</th>
                            <th class="p-3">Jumlah Disapih</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-data">
                        <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
