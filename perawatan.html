
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perawatan - SIP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script type="module">
        import { db, requireAuth } from "./firebase.js";
        import {
            collection,
            addDoc,
            getDocs,
            query,
            orderBy,
            doc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        if (!(await requireAuth())) {
            throw new Error("Login diperlukan.");
        }

        const koleksi = collection(db, "perawatan");
        const form = document.getElementById("form-perawatan");
        const tabel = document.getElementById("tabel-data");

        let dataPerawatan = [];
        let idEdit = null;

        function hariIni() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function aman(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[c]));
        }

        function formatJumlah(jumlah, satuan) {
            if (jumlah === null || jumlah === undefined || jumlah === "") {
                return "-";
            }

            return `${Number(jumlah).toLocaleString("id-ID")} ${aman(satuan || "")}`;
        }

        function tampilkanRingkasan() {
            const penyiraman = dataPerawatan.filter(d => d.jenis === "Penyiraman Rutin").length;
            const pemupukan = dataPerawatan.filter(d => d.jenis === "Pemupukan NPK/Organik").length;
            const penyemprotan = dataPerawatan.filter(d => d.jenis === "Penyemprotan Pestisida").length;

            document.getElementById("ringkasan").innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow">
                    <p class="text-sm text-slate-500">Total Kegiatan</p>
                    <p class="text-2xl font-bold text-emerald-700">${dataPerawatan.length}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow">
                    <p class="text-sm text-slate-500">Penyiraman</p>
                    <p class="text-2xl font-bold text-blue-700">${penyiraman}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow">
                    <p class="text-sm text-slate-500">Pemupukan</p>
                    <p class="text-2xl font-bold text-orange-700">${pemupukan}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow">
                    <p class="text-sm text-slate-500">Penyemprotan</p>
                    <p class="text-2xl font-bold text-purple-700">${penyemprotan}</p>
                </div>
            `;
        }

        function tampilkanTabel() {
            tabel.innerHTML = "";

            if (!dataPerawatan.length) {
                tabel.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-4 text-center text-slate-400">
                            Belum ada riwayat perawatan.
                        </td>
                    </tr>
                `;
                tampilkanRingkasan();
                return;
            }

            dataPerawatan.forEach((d, index) => {
                const tr = document.createElement("tr");
                tr.className = "border-b hover:bg-emerald-50";

                tr.innerHTML = `
                    <td class="p-3">${index + 1}</td>
                    <td class="p-3">${aman(d.tanggal || "-")}</td>
                    <td class="p-3 font-medium">${aman(d.jenis || "-")}</td>
                    <td class="p-3">${aman(d.lokasi || "-")}</td>
                    <td class="p-3">${formatJumlah(d.jumlah, d.satuan)}</td>
                    <td class="p-3 text-slate-600">${aman(d.catatan || "-")}</td>
                    <td class="p-3 whitespace-nowrap">
                        <button type="button"
                            data-edit="${aman(d.id)}"
                            class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-semibold mr-1">
                            Edit
                        </button>
                        <button type="button"
                            data-hapus="${aman(d.id)}"
                            class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-xs font-semibold">
                            Hapus
                        </button>
                    </td>
                `;

                tabel.appendChild(tr);
            });

            tabel.querySelectorAll("[data-edit]").forEach(button => {
                button.addEventListener("click", () => mulaiEdit(button.dataset.edit));
            });

            tabel.querySelectorAll("[data-hapus]").forEach(button => {
                button.addEventListener("click", () => hapusData(button.dataset.hapus));
            });

            tampilkanRingkasan();
        }

        async function muatData() {
            const q = query(koleksi, orderBy("tanggal", "desc"));
            const snapshot = await getDocs(q);

            dataPerawatan = snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));

            tampilkanTabel();
        }

        function mulaiEdit(id) {
            const d = dataPerawatan.find(item => item.id === id);
            if (!d) return;

            idEdit = id;

            document.getElementById("p-tanggal").value = d.tanggal || "";
            document.getElementById("p-jenis").value = d.jenis || "Penyiraman Rutin";
            document.getElementById("p-lokasi").value = d.lokasi || "";
            document.getElementById("p-jumlah").value = d.jumlah ?? "";
            document.getElementById("p-satuan").value = d.satuan || "";
            document.getElementById("p-catatan").value = d.catatan || "";

            document.getElementById("judul-form").textContent = "Edit Data Perawatan";
            document.getElementById("tombol-simpan").textContent = "Simpan Perubahan";
            document.getElementById("tombol-batal").classList.remove("hidden");

            form.scrollIntoView({ behavior: "smooth" });
        }

        function batalEdit() {
            idEdit = null;
            form.reset();

            document.getElementById("p-tanggal").value = hariIni();
            document.getElementById("judul-form").textContent = "Catat Jadwal Penyiraman & Pemupukan";
            document.getElementById("tombol-simpan").textContent = "Simpan ke Cloud";
            document.getElementById("tombol-batal").classList.add("hidden");
        }

        async function hapusData(id) {
            const data = dataPerawatan.find(item => item.id === id);
            if (!data) return;

            const yakin = confirm(
                `Apakah Anda yakin ingin menghapus catatan perawatan berikut?\n\n` +
                `Tanggal: ${data.tanggal || "-"}\n` +
                `Kegiatan: ${data.jenis || "-"}\n` +
                `Lokasi: ${data.lokasi || "-"}\n\n` +
                `Catatan ini akan dihapus dari riwayat.`
            );

            if (!yakin) return;

            try {
                await deleteDoc(doc(db, "perawatan", id));

                if (idEdit === id) {
                    batalEdit();
                }

                alert("Catatan perawatan berhasil dihapus.");
                await muatData();

            } catch (error) {
                console.error("Gagal menghapus data:", error);
                alert("Gagal menghapus data: " + error.message);
            }
        }

        document.getElementById("tombol-batal").addEventListener("click", batalEdit);

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const tanggal = document.getElementById("p-tanggal").value;
            const jenis = document.getElementById("p-jenis").value;
            const lokasi = document.getElementById("p-lokasi").value.trim();
            const jumlahInput = document.getElementById("p-jumlah").value;
            const satuan = document.getElementById("p-satuan").value;
            const catatan = document.getElementById("p-catatan").value.trim();

            const jumlah = jumlahInput === "" ? null : Number(jumlahInput);

            if (!tanggal || !jenis || !lokasi) {
                alert("Tanggal, jenis kegiatan, dan lokasi wajib diisi.");
                return;
            }

            if (jumlah !== null && (!Number.isFinite(jumlah) || jumlah <= 0)) {
                alert("Jumlah pemakaian harus lebih dari nol.");
                return;
            }

            if (jumlah !== null && !satuan) {
                alert("Pilih satuan jumlah pemakaian.");
                return;
            }

            const tombol = document.getElementById("tombol-simpan");
            tombol.disabled = true;
            tombol.textContent = "Menyimpan...";

            try {
                const payload = {
                    tanggal,
                    jenis,
                    lokasi,
                    catatan,
                    jumlah,
                    satuan,
                    timestamp: new Date()
                };

                if (idEdit) {
                    await updateDoc(doc(db, "perawatan", idEdit), payload);
                    alert("Data perawatan berhasil diperbarui.");
                } else {
                    await addDoc(koleksi, payload);
                    alert("Data perawatan berhasil disimpan.");
                }

                batalEdit();
                await muatData();

            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert("Gagal menyimpan data: " + error.message);
            } finally {
                tombol.disabled = false;
                tombol.textContent = idEdit ? "Simpan Perubahan" : "Simpan ke Cloud";
            }
        });

        document.getElementById("p-tanggal").value = hariIni();

        try {
            await muatData();
        } catch (error) {
            console.error(error);
            tabel.innerHTML = `
                <tr>
                    <td colspan="7" class="p-4 text-center text-red-600">
                        Gagal memuat data: ${aman(error.message)}
                    </td>
                </tr>
            `;
        }
    </script>
</head>

<body class="bg-emerald-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🌱 SIP - Log Perawatan</h1>
            <a href="index.html" class="text-xs bg-emerald-900 px-3 py-1.5 rounded-lg">
                Kembali
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <section>
            <h2 class="text-lg font-bold text-emerald-900 mb-3">Ringkasan Kegiatan Perawatan</h2>
            <div id="ringkasan" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow">Memuat data...</div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow">
            <h2 id="judul-form" class="text-xl font-bold text-emerald-900 mb-4">
                Catat Jadwal Penyiraman & Pemupukan
            </h2>

            <form id="form-perawatan" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium">Tanggal Kegiatan</label>
                    <input type="date" id="p-tanggal" required class="w-full mt-1 p-3 border rounded-xl">
                </div>

                <div>
                    <label class="block text-sm font-medium">Jenis Kegiatan</label>
                    <select id="p-jenis" required class="w-full mt-1 p-3 border rounded-xl">
                        <option value="Penyiraman Rutin">Penyiraman Rutin</option>
                        <option value="Pemupukan NPK/Organik">Pemupukan NPK/Organik</option>
                        <option value="Penyemprotan Pestisida">Penyemprotan Pestisida</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium">Lokasi Blok / Bedeng</label>
                    <input type="text" id="p-lokasi" required placeholder="Contoh: Blok B3" class="w-full mt-1 p-3 border rounded-xl">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Jumlah Pemakaian (opsional)</label>
                        <input type="number" id="p-jumlah" min="0.01" step="0.01" placeholder="Contoh: 5" class="w-full mt-1 p-3 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Satuan</label>
                        <select id="p-satuan" class="w-full mt-1 p-3 border rounded-xl">
                            <option value="">Pilih satuan</option>
                            <option value="liter">Liter</option>
                            <option value="kg">Kilogram (kg)</option>
                            <option value="gram">Gram</option>
                            <option value="m³">Meter kubik (m³)</option>
                            <option value="karung">Karung</option>
                            <option value="tangki">Tangki</option>
                            <option value="paket">Paket</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium">Catatan / Dosis</label>
                    <textarea id="p-catatan" placeholder="Contoh: Dosis 2 gram per liter air" class="w-full mt-1 p-3 border rounded-xl"></textarea>
                </div>

                <div class="flex gap-2">
                    <button id="tombol-simpan" type="submit" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white p-3 rounded-xl font-medium disabled:opacity-50">
                        Simpan ke Cloud
                    </button>
                    <button id="tombol-batal" type="button" class="hidden bg-slate-200 px-4 rounded-xl">
                        Batal
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-lg font-bold text-emerald-900 mb-4">Riwayat Log Perawatan</h3>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900">
                            <th class="p-3">No</th>
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Kegiatan</th>
                            <th class="p-3">Lokasi</th>
                            <th class="p-3">Jumlah</th>
                            <th class="p-3">Catatan</th>
                            <th class="p-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-data">
                        <tr>
                            <td colspan="7" class="p-4 text-center text-slate-400">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>
</html>
