<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opname Fisik - SIP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAt_r5DKu5GYfYQSz_tJ4RhxIGwb-TLTVQ",
            authDomain: "sip-persemaian-app.firebaseapp.com",
            projectId: "sip-persemaian-app",
            storageBucket: "sip-persemaian-app.appspot.com",
            messagingSenderId: "298884874547",
            appId: "1:298884874547:web:9ffbf2f56971b0ee8981246"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadDataAwal() {
            const snap = await getDocs(collection(db, "penyapihan"));
            let select = document.getElementById('o-batch');
            snap.forEach(doc => {
                let d = doc.data();
                select.innerHTML += `<option value="${d.batch}">${d.batch} (${d.lokasi})</option>`;
            });

            const snapOpname = await getDocs(collection(db, "opname_fisik"));
            let tbody = document.getElementById('tabel-data');
            tbody.innerHTML = "";
            let no = 1;
            snapOpname.forEach(doc => {
                let d = doc.data();
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${no++}</td>
                        <td class="p-3 font-medium">${d.batch}</td>
                        <td class="p-3 font-semibold text-orange-700">${d.jumlah} Bibit</td>
                        <td class="p-3 text-slate-600">${d.catatan || '-'}</td>
                    </tr>
                `;
            });
        }
        window.onload = loadDataAwal;

        window.simpanData = async function(e) {
            e.preventDefault();
            try {
                await addDoc(collection(db, "opname_fisik"), {
                    batch: document.getElementById('o-batch').value,
                    jumlah: parseInt(document.getElementById('o-jumlah').value),
                    catatan: document.getElementById('o-catatan').value,
                    timestamp: new Date()
                });
                alert('Opname fisik berhasil diperbarui ke Cloud!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Gagal menyimpan.');
            }
        }
    </script>
</head>
<body class="bg-emerald-50 text-slate-800 font-sans min-h-screen">
    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🌱 SIP - Opname Fisik Bedeng</h1>
            <a href="index.html" class="text-xs bg-emerald-900 px-3 py-1.5 rounded-lg">Kembali</a>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <div class="bg-white p-6 rounded-2xl shadow">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">Koreksi Jumlah Fisik Terbaru di Bedeng</h2>
            <form onsubmit="simpanData(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Pilih Batch Sapih</label>
                    <select id="o-batch" required class="w-full mt-1 p-3 border rounded-xl">
                        <option value="">-- Pilih Batch Sapih --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Jumlah Sisa Fisik Terbaru</label>
                    <input type="number" id="o-jumlah" required placeholder="3800" class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium">Catatan / Alasan</label>
                    <input type="text" id="o-catatan" placeholder="Opname mingguan" class="w-full mt-1 p-3 border rounded-xl">
                </div>
                <button type="submit" class="w-full bg-emerald-700 text-white p-3 rounded-xl font-medium cursor-pointer">Simpan ke Cloud</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-lg font-bold text-emerald-900 mb-4">Riwayat Opname Fisik</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900">
                            <th class="p-3">No</th>
                            <th class="p-3">Batch Sapih</th>
                            <th class="p-3">Jumlah Fisik</th>
                            <th class="p-3">Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-data">
                        <tr><td colspan="4" class="p-4 text-center text-slate-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
