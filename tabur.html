
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabur Benih - SIP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script type="module">
        import { db, requireAuth } from "./firebase.js";
        import {
            collection,
            addDoc,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        if (!(await requireAuth())) {
            throw new Error("Login diperlukan.");
        }

        const tabelData = document.getElementById("tabel-data");
        const tombolSimpan = document.getElementById("tombol-simpan");

        // Data tabur yang sedang dimuat, dipakai untuk saran dan pemeriksaan.
        let dataTabur = [];

        const normKode = v => String(v ?? "").trim().toUpperCase();

        const normJenis = v =>
            String(v ?? "").trim().toLowerCase().replace(/\s+/g, " ");

        // Penulisan yang paling sering dipakai dari sekumpulan teks.
        function penulisanUmum(daftar) {
            const hitung = new Map();
            daftar.forEach(t => hitung.set(t, (hitung.get(t) || 0) + 1));
            return [...hitung.entries()].sort((a, b) => b[1] - a[1])[0][0];
        }

        // Menyamakan kode batch dan jenis dengan data yang sudah ada,
        // menolak jenis yang berbeda untuk batch yang sama, dan
        // menandai data yang identik dengan data sebelumnya.
        function periksaBatch(daftar, kode, jenis, tanggal, jumlah) {
            const sama = daftar.filter(
                d => d.kode && normKode(d.kode) === normKode(kode)
            );

            let kodeFinal = kode;
            let jenisFinal = jenis;
            let disesuaikan = false;

            if (sama.length) {
                kodeFinal = penulisanUmum(sama.map(d => String(d.kode).trim()));

                const cocok = sama.filter(
                    d => normJenis(d.jenis) === normJenis(jenis)
                );

                if (!cocok.length) {
                    const ada = [...new Set(
                        sama.map(d => String(d.jenis || "-").trim())
                    )].join("; ");

                    return {
                        ok: false,
                        pesan:
                            `Kode batch ${kodeFinal} sudah tercatat dengan jenis: ${ada}.\n\n` +
                            "Gunakan salah satu penulisan jenis tersebut, " +
                            "atau pakai kode batch baru untuk jenis yang berbeda."
                    };
                }

                jenisFinal = penulisanUmum(cocok.map(d => String(d.jenis).trim()));
                disesuaikan = kodeFinal !== kode || jenisFinal !== jenis;
            }

            const duplikat = sama.some(
                d =>
                    normJenis(d.jenis) === normJenis(jenis) &&
                    d.tanggal === tanggal &&
                    Number(d.jumlah) === jumlah
            );

            return { ok: true, kode: kodeFinal, jenis: jenisFinal, duplikat, disesuaikan };
        }

        // Saran kode batch dan jenis dari data yang sudah ada.
        function isiDaftarSaran() {
            const isi = (idDatalist, nilai) => {
                const el = document.getElementById(idDatalist);
                if (!el) return;
                el.replaceChildren();
                [...new Set(nilai.filter(Boolean).map(v => String(v).trim()))]
                    .sort()
                    .forEach(v => {
                        const opt = document.createElement("option");
                        opt.value = v;
                        el.appendChild(opt);
                    });
            };

            isi("daftar-kode", dataTabur.map(d => d.kode));
            isi("daftar-jenis", dataTabur.map(d => d.jenis));
        }

        function tampilkanGalat(pesan) {
            tabelData.replaceChildren();

            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 5;
            td.className = "p-4 text-center text-red-600";
            td.textContent = "Gagal memuat data: " + pesan;
            tr.appendChild(td);
            tabelData.appendChild(tr);
        }

        // Memuat riwayat tabur benih
        async function muatTabel() {
            tabelData.innerHTML = `
                <tr>
                    <td colspan="5" class="p-4 text-center text-slate-400">
                        Memuat data...
                    </td>
                </tr>
            `;

            try {
                const querySnapshot = await getDocs(
                    collection(db, "tabur_benih")
                );

                dataTabur = querySnapshot.docs.map(x => x.data());
                isiDaftarSaran();

                tabelData.innerHTML = "";

                if (querySnapshot.empty) {
                    tabelData.innerHTML = `
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">
                                Belum ada data tabur benih.
                            </td>
                        </tr>
                    `;
                    return;
                }

                const data = [];

                querySnapshot.forEach((doc) => {
                    data.push(doc.data());
                });

                // Urutkan berdasarkan tanggal terbaru
                data.sort((a, b) => {
                    return String(b.tanggal || "").localeCompare(
                        String(a.tanggal || "")
                    );
                });

                data.forEach((d, index) => {
                    const tr = document.createElement("tr");
                    tr.className = "border-b hover:bg-emerald-50";

                    const nilai = [
                        index + 1,
                        d.kode || "-",
                        d.jenis || "-",
                        d.tanggal || "-",
                        `${Number(d.jumlah || 0).toLocaleString("id-ID")} Butir`
                    ];

                    nilai.forEach((isi, kolom) => {
                        const td = document.createElement("td");
                        td.className = "p-3";

                        if (kolom === 1) {
                            td.classList.add("font-medium");
                        }

                        if (kolom === 4) {
                            td.classList.add(
                                "font-semibold",
                                "text-emerald-700"
                            );
                        }

                        td.textContent = isi;
                        tr.appendChild(td);
                    });

                    tabelData.appendChild(tr);
                });

            } catch (error) {
                console.error("Gagal memuat tabel:", error);

                tampilkanGalat(error.message);
            }
        }

        // Menyimpan data tabur benih
        window.simpanData = async function(e) {
            e.preventDefault();

            const kode = document.getElementById("t-kode").value.trim();
            const jenis = document.getElementById("t-jenis").value.trim();
            const tanggal = document.getElementById("t-tanggal").value;
            const jumlah = Number(
                document.getElementById("t-jumlah").value
            );

            if (!kode || !jenis || !tanggal) {
                alert("Mohon lengkapi seluruh data.");
                return;
            }

            if (!Number.isSafeInteger(jumlah) || jumlah <= 0) {
                alert("Jumlah benih harus berupa bilangan bulat lebih dari 0.");
                return;
            }

            try {
                tombolSimpan.disabled = true;
                tombolSimpan.textContent = "Memeriksa batch...";

                // Baca ulang data terbaru sebelum menyimpan.
                const terbaru = await getDocs(collection(db, "tabur_benih"));
                const periksa = periksaBatch(
                    terbaru.docs.map(x => x.data()),
                    kode, jenis, tanggal, jumlah
                );

                if (!periksa.ok) {
                    alert(periksa.pesan);
                    return;
                }

                if (
                    periksa.duplikat &&
                    !confirm(
                        "Data dengan batch, jenis, tanggal, dan jumlah yang sama " +
                        "sudah tercatat.\n\nIni mungkin input ganda. Tetap simpan?"
                    )
                ) {
                    return;
                }

                tombolSimpan.textContent = "Menyimpan...";

                await addDoc(collection(db, "tabur_benih"), {
                    kode: periksa.kode,
                    jenis: periksa.jenis,
                    tanggal: tanggal,
                    jumlah: jumlah,
                    timestamp: new Date()
                });

                alert(
                    "Data tabur berhasil disimpan ke Cloud!" +
                    (periksa.disesuaikan
                        ? `\n\nPenulisan disesuaikan dengan data yang sudah ada:\n` +
                          `Kode batch: ${periksa.kode}\nJenis: ${periksa.jenis}`
                        : "")
                );

                document.getElementById("form-tabur").reset();

                await muatTabel();

            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert("Gagal menyimpan data: " + error.message);

            } finally {
                tombolSimpan.disabled = false;
                tombolSimpan.textContent = "Simpan ke Cloud";
            }
        };

        // Jalankan setelah autentikasi berhasil
        await muatTabel();
    </script>
</head>

<body class="bg-emerald-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🌱 SIP - Tabur Benih</h1>
            <a href="index.html" class="text-xs bg-emerald-900 px-3 py-1.5 rounded-lg">
                Kembali
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

        <div class="bg-white p-6 rounded-2xl shadow">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">
                Formulir Tabur Benih
            </h2>

            <form id="form-tabur" onsubmit="simpanData(event)" class="space-y-4">

                <datalist id="daftar-kode"></datalist>
                <datalist id="daftar-jenis"></datalist>

                <div>
                    <label class="block text-sm font-medium">
                        Kode Batch
                    </label>
                    <input
                        type="text"
                        id="t-kode"
                        list="daftar-kode"
                        autocomplete="off"
                        required
                        placeholder="BATCH-PULAI-01"
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium">
                        Jenis Pohon
                    </label>
                    <input
                        type="text"
                        id="t-jenis"
                        list="daftar-jenis"
                        autocomplete="off"
                        required
                        placeholder="Alstonia spatulata (Pulai)"
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium">
                        Tanggal Tabur
                    </label>
                    <input
                        type="date"
                        id="t-tanggal"
                        required
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium">
                        Jumlah Benih
                    </label>
                    <input
                        type="number"
                        id="t-jumlah"
                        required
                        min="1"
                        step="1"
                        placeholder="5000"
                        class="w-full mt-1 p-3 border rounded-xl"
                    >
                </div>

                <button
                    type="submit"
                    id="tombol-simpan"
                    class="w-full bg-emerald-700 text-white p-3 rounded-xl font-medium cursor-pointer disabled:opacity-50"
                >
                    Simpan ke Cloud
                </button>

            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-lg font-bold text-emerald-900 mb-4">
                Riwayat Tabur Benih
            </h3>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">

                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900">
                            <th class="p-3">No</th>
                            <th class="p-3">Kode Batch</th>
                            <th class="p-3">Jenis Pohon</th>
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Jumlah</th>
                        </tr>
                    </thead>

                    <tbody id="tabel-data">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </main>

</body>
</html>
